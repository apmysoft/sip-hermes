# ============================================================================
# policy.conf — PEP de filegate (Fase 1B)
# Formato: zona|op|root     (root lógico; ver root_path en filegate.sh)
# Raíces: PARA · ENTRADA (PARA/00_entrada) · PROYECTOS · RECURSOS · STAGING · QUAR
# Alcance mínimo acordado 2026-09-21: se escala en la fase correcta.
# ============================================================================
# RESEARCH: write-only hacia 00_entrada y staging (v2.4 D/F)
research|write|ENTRADA
research|write|STAGING
research|mkdir|ENTRADA
research|mkdir|STAGING
# PERSONAL: mueve dentro de PARA; staging; cuarentena; restore; plan
personal|move-src|PARA
personal|move-dst|PARA
personal|write|STAGING
personal|mkdir|PARA
personal|mkdir|STAGING
personal|quarantine-src|PARA
personal|quarantine-src|STAGING
personal|restore|PARA
personal|restore|STAGING
personal|plan|PARA
personal|plan|STAGING
# CODING: staging rw; promoción staging→01_proyectos; nada más de PARA
coding|write|STAGING
coding|mkdir|STAGING
coding|write|PROYECTOS
coding|mkdir|PROYECTOS
coding|move-src|STAGING
coding|move-dst|PROYECTOS
coding|plan|STAGING
# GESTOR: Gestor de Entrada (Fase 4, Nivel 1). Solo ejecuta renombres YA
# aprobados por el humano (apply verifica approved/approve_all + ruta+hash);
# todo dentro de ENTRADA (renombra en el sitio); fail-closed por diseno.
# No write/mkdir (no crea nada nuevo; las escrituras nuevas van a STAGING, G.3#2).
gestor|move-src|ENTRADA
gestor|move-dst|ENTRADA
gestor|move-dst|PARA
gestor|quarantine-src|PARA
gestor|quarantine-src|STAGING
gestor|restore|PARA
gestor|plan|ENTRADA
gestor|plan|PARA
# ADMIN: token solo en Neo (tests + mantenimiento); no se distribuye
admin|move-src|PARA
admin|move-src|STAGING
admin|move-dst|PARA
admin|move-dst|STAGING
admin|write|PARA
admin|write|STAGING
admin|mkdir|PARA
admin|mkdir|STAGING
admin|quarantine-src|PARA
admin|quarantine-src|STAGING
admin|restore|PARA
admin|restore|STAGING
admin|plan|PARA
admin|plan|STAGING
admin|log|*
