# SIP Fase 6 — Config LiteLLM (sanitized; versionable)
#
# Copiar a /opt/sip-litellm/litellm.config.yaml en Neo.
# este fichero NO contiene secretos: master_key y database_url se resuelven
# del env (/root/sip-litellm.env) con la sintaxis os.environ/<VAR>.
#
# Regla v2.4: los proveedores se añaden/editan SOLO aquí + env. Nunca por UI.
# Cada clave virtual lista sus modelos: cloud solo en sk-research-cloud.

model_list:
  # Solo datos no personales. Clave de Google AI Studio, sin facturación.
  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-3.8-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
  # Suscripción personal del usuario, con cuota compartida: solo por petición explícita, fuera
  # de cadenas de fallback. k3.1-pro rechaza las peticiones sin razonamiento.
  - model_name: k3.1-pro
    litellm_params:
      model: openai/k3.1-pro
      api_base: https://api.kimi.ai/coding/v1
      api_key: os.environ/KIMI_API_KEY
      extra_body:
        reasoning_effort: high
  # openai-compatible passthrough al endpoint /v1 de Ollama en HALO (tailnet)
  - model_name: qwen3.8:27b
    litellm_params:
      model: openai/qwen3.8:27b
      api_base: http://${HALO_TAILNET_IP}:11434/v1
      api_key: ollama
  # ejecutor de CODING (03-11-2026): misma base con num_ctx 65536 y temperature 0.6 (Modelfile en HALO)
  - model_name: qwen3.8:27b-64k
    litellm_params:
      model: openai/qwen3.8:27b-64k
      api_base: http://${HALO_TAILNET_IP}:11434/v1
      api_key: ollama
  - model_name: qwen3.6:27b
    litellm_params:
      model: openai/qwen3.6:27b
      api_base: http://${HALO_TAILNET_IP}:11434/v1
      api_key: ollama
  - model_name: gpt-oss:20b
    litellm_params:
      model: openai/gpt-oss:20b
      api_base: http://${HALO_TAILNET_IP}:11434/v1
      api_key: ollama
  - model_name: qwen3-coder:30b
    litellm_params:
      model: openai/qwen3-coder:30b
      api_base: http://${HALO_TAILNET_IP}:11434/v1
      api_key: ollama

router_settings:
  routing_strategy: simple-shuffle

litellm_settings:
  drop_params: true
  # sin telemetría externa; instalar paquetes extras deshabilitado
  allow_requests_on_proxy_unavailable: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DB_URL
  # bloquea el login por credenciales de entorno de la UI (extra a DISABLE_ADMIN_UI)
  disable_env_credential_login: true
