# Spike HALO: el worker solo ejecuta comandos mediante el launcher aislado.
# Claves autorizadas fuera de su home escribible, bajo control de root.
Match User hermes-worker
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    ForceCommand /usr/local/bin/sip-hermes-worker-shell
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
Match all
